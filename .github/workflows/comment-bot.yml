name: Instagram Comment Bot

on:
  schedule:
    # Every 4 hours. GitHub cron is UTC.
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climavids-instagram-automation
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRY_RUN: 'true'
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      META_APP_ACCESS_TOKEN: ${{ secrets.META_APP_ACCESS_TOKEN }}
      META_API_VERSION: 'v23.0'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run comment cycle
        run: PYTHONPATH=. python src/comment_handler.py
