name: Instagram Comment Bot

on:
  schedule:
    # Every 4 hours. GitHub cron is UTC.
    - cron: '0 */4 * * *'
  workflow_dispatch:

# The bot commits only runtime state to the dedicated state branch.
# No pull-request or workflow administration permissions are granted.
permissions:
  contents: write

# Comment and content jobs share the state branch; serialize them to avoid
# lost-update races when either workflow commits runtime state/cache.
concurrency:
  group: climavids-instagram-automation-state
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Live replies remain disabled until explicit approval.
      DRY_RUN: 'true'
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      META_APP_ACCESS_TOKEN: ${{ secrets.META_APP_ACCESS_TOKEN }}
      META_API_VERSION: 'v23.0'
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run comment cycle
        run: python -m src.comment_handler
