name: Daily Instagram Content

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC
    - cron: '0 21 * * *'  # 21:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: climavids-daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: 'true'
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run daily content cycle (dry-run only)
        run: PYTHONPATH=. python src/content_publisher.py
